    <text class="cls-5" transform="translate(281.98 536.95)"><tspan x="0" y="0">グローバルIPアドレスの固定化を行っていないため、入口(Ent</tspan><tspan class="cls-34" x="388.43" y="0">r</tspan><tspan x="393.72" y="0">yノード)を設け、So</tspan><tspan class="cls-36" x="521.47" y="0">c</tspan><tspan x="529.44" y="0">atを使用し</tspan><tspan class="cls-16" x="597.7" y="0">T</tspan><tspan x="605.48" y="0">ails</tspan><tspan class="cls-36" x="626.99" y="0">c</tspan><tspan x="634.96" y="0">ale経由でCent</tspan><tspan class="cls-32" x="726.87" y="0">r</tspan><tspan x="731.92" y="0">alへとポート転送をしています。</tspan><tspan x="0" y="24.5">本来であればCloudfla</tspan><tspan class="cls-23" x="138.28" y="24.5">r</tspan><tspan x="143.17" y="24.5">e </tspan><tspan class="cls-18" x="155.03" y="24.5">T</tspan><tspan x="162.86" y="24.5">unnelのようなサービスを使うべきですが、HTTP以外のプロトコルに対応していなかったり、</tspan><tspan x="0" y="49">サーバー側で新しい技術を自由に取り入れるためにはプロキシを介さない必要があるため、このような非効率的な方法をとっている状況です。</tspan></text>
  </g>
