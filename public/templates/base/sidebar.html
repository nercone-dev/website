{% extends "/base/default.html" %}

{% block header_start_before %}
<button class="sidebar-toggle" type="button" popovertarget="sidebar" aria-controls="sidebar" aria-label="Open the menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
</button>
{% endblock %}

{% block main_before %}
{% block sidebar_before %}{% endblock %}
{% block sidebar_outer %}
<nav id="sidebar" class="sidebar" popover aria-label="{% block sidebar_title %}Sidebar{% endblock %}">{% block sidebar %}{% endblock %}</nav>
{% endblock %}
{% block sidebar_after %}{% endblock %}
{% endblock %}
