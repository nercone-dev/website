[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "nercone-website"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]",
    "aioquic",
    "websockets",

    "fastapi",
    "uvicorn[standard]",

    "beautifulsoup4",

    "jinja2",
    "resvg-py",

    "mistune",
    "markitdown",

    "zstandard",
    "brotlicffi",

    "minify-html",
    "rcssmin",
    "rjsmin",
    "scour",

    "nercone-modern",
    "tzdata",
    "pyyaml",
    "fourword"
]

[tool.uv.sources]
aioquic = { git = "https://github.com/nercone-forks/aioquic", branch = "feature/pqc-support" }

[project.scripts]
nercone-website = "nercone_website.__main__:main"
