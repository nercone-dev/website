[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "nercone-website"
version = "1.0.0"
requires-python = ">=3.12,<=3.14"
dependencies = [
    # Framework
    "fastapi",
    "uvicorn[standard]",

    # Markdown
    "mistune",
    "markitdown",
    "beautifulsoup4",

    # Minification
    "minify-html",
    "rcssmin",
    "rjsmin",
    "scour",

    # Compression
    "zstandard",
    "brotlicffi",

    # Misc
    "resvg-py",
    "jinja2",
    "tzdata",
    "xxhash",
    "pyyaml",
    "httpx",
    "fwid",
]

[project.scripts]
nercone-website = "website.__main__:main"

[tool.uv.build-backend]
module-name = "website"
