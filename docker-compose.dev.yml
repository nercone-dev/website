services:
  website:
    container_name: website
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WEBSITE_DEV: 1
      WEBSITE_TCP: 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - "./.git:/srv/website/.git:ro"
      - "./logs:/srv/website/logs"
      - "./databases:/srv/website/databases"
      - "./public:/srv/website/public:ro"
